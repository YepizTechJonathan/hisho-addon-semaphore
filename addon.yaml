# Semaphore UI integration: one entry per Semaphore server (Ansible / Terraform runner).
# Shows each project's task templates with how their last run went, and runs a template when
# you press its button (always asks first). It also adds and keeps in step the jobs listed in
# ~/Hisho/System/Config/Addons/semaphore-templates.yaml (it never runs or deletes them), so a new
# guarded job is one entry in your notes. Hisho's own jobs (self-update, code sync, security review, reports, and the
# Forgejo / secrets / Proxmox ones when those are on) go in a "Hisho" project it makes and keeps in step with its
# machine list: by itself when Hisho installed Semaphore, after the card's "Add Hisho's jobs" button when you connected
# one (hisho_jobs.py; playbooks in ansible/). Failed and missed scheduled runs, and a Semaphore that stops
# answering, show in Needs you. Updates and maintenance stay in your playbooks. Needs an API token (Semaphore: your user menu >
# API Tokens, or POST /api/user/tokens).
name: semaphore
kind: integration
secret_rotate: Semaphore > your user > API Tokens
title: Semaphore (Ansible / Terraform)
description: Your Semaphore servers' playbooks and Terraform jobs, their last runs, a run button, and new jobs added from your notes.
version: 0.4.0
you_need:
  - "A Semaphore UI server (Ansible and Terraform runner) you can reach from the Core machine"
  - "A Semaphore API token"
provider: provider.py
# Install in Hisho: Semaphore itself, when there is none (Hisho's install, pinned images)
companion:
  title: Semaphore
  install: companion/install.sh
  data_dir: ~/semaphore
  ports: {http: 3010}
  health: {http: "http://127.0.0.1:3010/api/ping", expect: 200, timeout: 300}
  detect: {containers: [semaphore], http: ["http://127.0.0.1:3010/api/ping"], entry: url}
  entry: {url: "https://{core_dns}:4443"}
  requires: [docker, tailscale]
entry_label: Semaphore server
entry_schema:
  url: str                 # IP or name (http, port 3000 assumed), or the full URL
  token: password          # API token (typed, or its secret's name)
  timezone: "str?"         # the Semaphore's schedule time zone (SEMAPHORE_SCHEDULE_TIMEZONE); default UTC
  playbooks: "str?"        # where Semaphore reads Hisho's playbooks (a path in its container); default /hisho/ansible
  note: "str?"
entry_form:
  url: "IP address (or full URL)"
  token: "API token (paste it, or its secret's name)"
  timezone: "Schedule time zone (e.g. America/Los_Angeles; blank = UTC)"
  playbooks: "Hisho's playbooks in Semaphore (blank = /hisho/ansible)"
  note: "Note"

# Plain words for each field of the entry form (shown on the dashboard).
help:
  url:
    label: Semaphore address
    say: "Where Semaphore is: its full web address, like https://semaphore.example.com, or just its IP address or name (then Hisho uses http and port 3000). Filled in for you if Hisho installed Semaphore."
  token:
    label: API token
    say: "A Semaphore API token: paste it, or type the name of a saved secret that holds it. In Semaphore it is under your user menu > API Tokens. If Hisho installed Semaphore, its install can save one for you as a secret."
    get: "https://docs.semaphoreui.com/administration-guide/api"
    get_label: Read how to make a token
  timezone:
    label: Time zone of its schedules (optional)
    say: "The time zone Semaphore runs its schedules in, like America/Los_Angeles. Hisho uses it to tell when a scheduled run was missed. Leave empty for UTC. Hisho's own install uses your time zone."
  playbooks:
    label: Where Semaphore reads Hisho's playbooks (optional)
    say: "Only for a Semaphore you connected: the folder inside Semaphore's container that holds this add-on's ansible folder (mount it read-only there). Leave empty for /hisho/ansible, where Hisho's own install puts it."
  note:
    say: "Anything you want to remember about this server. Shown on its card."
